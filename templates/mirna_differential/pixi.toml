[workspace]
name = "mirna_differential"
channels = ["conda-forge", "bioconda", "r"]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = { cmd = ["python", "configure_analysis.py", "--configure"] }
validate = { cmd = ["python", "configure_analysis.py", "--validate"] }
analyze = { cmd = ["Rscript", "miRNA_constructor.R"] }
test = { cmd = ["python", "test.py"] }
install-bioc-data = { cmd = ["bash", "install_bioc_data.sh"] }

[dependencies]
python = ">=3.11,<3.14"
pyyaml = ">=6,<7"
rich = ">=13.9,<15"
quarto = ">=1.6,<2"
pandoc = ">=3,<4"
r-base = ">=4.4,<4.6"
r-yaml = ">=2.3,<3"
r-readr = ">=2.1,<3"
r-dplyr = ">=1.1,<2"
r-tidyr = ">=1.3,<2"
r-tibble = ">=3.2,<4"
r-ggplot2 = ">=4.0,<5"
r-ggrepel = ">=0.9,<1"
r-rcolorbrewer = ">=1.1,<2"
r-scales = ">=1.3,<2"
r-htmltools = ">=0.5,<1"
r-knitr = ">=1.49,<2"
r-rmarkdown = ">=2.29,<3"
r-openxlsx = ">=4.2,<5"
r-jsonlite = ">=1.8,<2"
bioconductor-deseq2 = ">=1.46,<2"
bioconductor-summarizedexperiment = ">=1.36,<2"
